<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081528">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Interactive map of Holden Beach, North Carolina — parks, landmarks, beach accesses, and public restrooms.">
  <link rel="icon" href="favicon.ico">
  <title>Holden Beach Map</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Holden Beach Map</h1>
            <p class="tagline">Parks, restrooms, beach accesses &amp; places</p>
          </div>
        </div>
        <button type="button" class="icon-btn" id="btn-layers" aria-expanded="false" aria-controls="layer-panel" title="Map layers">
          <span class="sr-only">Map layers</span>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M12 3 2 8.5 12 14l10-5.5L12 3zm0 8.2L4.2 8.5 12 4.8l7.8 3.7L12 11.2zM4 12.3l8 4.4 8-4.4v2.2L12 19l-8-4.5v-2.2z"/>
          </svg>
        </button>
      </div>
      <div class="search-wrap">
        <label class="sr-only" for="search">Search the map</label>
        <input id="search" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false"
               placeholder="Search parks, restrooms, accesses, places…">
        <button type="button" class="search-clear" id="search-clear" hidden aria-label="Clear search">×</button>
        <ul id="search-results" class="search-results" hidden role="listbox" aria-label="Search results"></ul>
      </div>
    </header>

    <div id="map" role="application" aria-label="Holden Beach interactive map"></div>

    <aside id="layer-panel" class="layer-panel" hidden>
      <div class="layer-panel-head">
        <h2>Layers</h2>
        <button type="button" class="icon-btn" id="btn-layers-close" aria-label="Close layers">×</button>
      </div>
      <label class="layer-row"><input type="checkbox" id="ly-streets" checked> Street names</label>
      <label class="layer-row"><input type="checkbox" id="ly-parks" checked> Parks &amp; Fit Trail</label>
      <label class="layer-row"><input type="checkbox" id="ly-landmarks" checked> Landmarks</label>
      <label class="layer-row"><input type="checkbox" id="ly-accesses" checked> Beach accesses</label>
      <label class="layer-row"><input type="checkbox" id="ly-restrooms" checked> Public restrooms</label>
      <p class="layer-note">The base map stays on. Turn layers off to unclutter the view.</p>
    </aside>

    <button type="button" class="locate-btn" id="btn-locate" title="Show my location" aria-label="Show my location">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path fill="currentColor" d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0-6.5a.9.9 0 0 1 .9.9V4.1a8 8 0 0 1 7 7h1.7a.9.9 0 0 1 0 1.8H19.9a8 8 0 0 1-7 7v1.7a.9.9 0 0 1-1.8 0V19.9a8 8 0 0 1-7-7H1.4a.9.9 0 0 1 0-1.8H4.1a8 8 0 0 1 7-7V2.4a.9.9 0 0 1 .9-.9zM12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/>
      </svg>
    </button>

    <div id="toast" class="toast" hidden role="status"></div>
  </div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
