<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="theme-color" content="#081528">
  <title>Claim your listing — Tour Holden Beach</title>
  <style>
    :root { --navy:#081528; --cream:#fffbf4; --sand:#f2e4c6; --gold:#d6b03e; --teal:#0a7080; --muted:#4c5a6a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--sand); color: var(--navy);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 18px 40px; }
    .card { background: var(--cream); border-radius: 18px; padding: 24px 20px; box-shadow: 0 8px 24px rgba(8,21,40,.15); }
    .kicker { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); margin: 0 0 6px; }
    h1 { font-size: 1.55rem; line-height: 1.2; margin: 0 0 6px; }
    .soon { display: inline-block; background: var(--gold); color: var(--navy); font-weight: 800; border-radius: 999px; padding: 4px 12px; font-size: .85rem; margin: 4px 0 16px; }
    p { line-height: 1.5; margin: 0 0 14px; }
    label { display: block; font-weight: 700; font-size: .9rem; margin: 0 0 6px; }
    input { width: 100%; height: 46px; border: 1px solid #e2d6bd; border-radius: 12px; padding: 0 12px; font-size: 16px; background: #fff; color: var(--navy); }
    input:focus { outline: none; box-shadow: 0 0 0 3px var(--gold); }
    .btn { display: block; text-align: center; text-decoration: none; border-radius: 12px; padding: 14px; font-weight: 800; font-size: 1rem; margin: 16px 0 0; }
    .btn.primary { background: var(--navy); color: var(--cream); }
    .btn.secondary { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
    .small { font-size: .85rem; color: var(--muted); margin: 14px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="kicker">Tour Holden Beach map</div>
      <h1>Claim your Tour Holden Beach listing</h1>
      <span class="soon">Coming soon</span>
      <p id="intro">Listing claims are opening soon. Leave us a note and we'll be in touch when they're available.</p>
      <label for="biz">Business name</label>
      <input id="biz" type="text" autocomplete="organization" placeholder="Your business name">
      <a id="mail" class="btn primary" href="mailto:tourholdenbeach@gmail.com">Email us about this listing</a>
      <a class="btn secondary" href="./">Back to the map</a>
      <p class="small">Questions? <a id="mail2" href="mailto:tourholdenbeach@gmail.com">tourholdenbeach@gmail.com</a></p>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script>
    (function () {
      var cfg = window.HB_CONFIG || {};
      var email = cfg.contactEmail || "tourholdenbeach@gmail.com";
      var q = new URLSearchParams(location.search);
      var name = (q.get("business") || "").slice(0, 120);
      var pin = (q.get("pin") || "").replace(/[^0-9]/g, "").slice(0, 4);
      var input = document.getElementById("biz");
      var mail = document.getElementById("mail");
      var mail2 = document.getElementById("mail2");
      input.value = name;
      if (name) document.getElementById("intro").textContent =
        "Is " + name + (pin ? " (pin " + pin + ")" : "") + " your business? Listing claims are opening soon. Email us and we'll be in touch when they're available.";
      function update() {
        var n = input.value.trim();
        var subject = "Claim my listing" + (n ? ": " + n : "") + (pin && n === name ? " (pin " + pin + ")" : "");
        var body = "Hi Tour Holden Beach,\n\nI'd like to claim the listing for " + (n || "my business") +
          (pin && n === name ? " (map pin " + pin + ")" : "") + " on the Holden Beach map.\n\nMy name:\nPhone:\n\nThanks!";
        mail.href = "mailto:" + email + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
        mail2.href = "mailto:" + email; mail2.textContent = email;
      }
      input.addEventListener("input", update);
      update();
    })();
  </script>
</body>
</html>
